; pytest configuration for InferOps.
;
; This file configures pytest and nothing else, and it is still the only place
; the pytest configuration lives. ADR 0009 settled the packaging tool, the
; dependency manager, the linter, the formatter, and the type checker, and put
; their configuration in pyproject.toml; its D8 deliberately left this file where
; it is. ADR 0005's consequences are the reason: a pyproject.toml that absorbed
; the marker list below would move the mechanism behind "the default lane cannot
; execute a real model" into a file nobody looks in for it.
;
; The marker list below is the executable half of the test strategy in
; docs/testing/test-strategy.md. Every marker a layer declares is registered
; here, --strict-markers refuses an unregistered one, and the default marker
; expression deselects every layer that needs a cluster or a model. That last
; part is what makes "the default lane cannot execute a real model" a property
; rather than a promise: a test that needs a capable host cannot run in the
; default lane by accident, only by naming its marker on the command line.
;
; tests/testing/test_test_strategy.py compares this file to the strategy data
; in both directions and fails if they disagree.

[pytest]
testpaths = tests
addopts =
    --strict-markers
    --strict-config
    -m "not cluster and not realruntime and not failure and not load"
asyncio_mode = auto

markers =
    unit: one domain rule in isolation; no adapter, no cluster, no runtime.
    contract: the published schema, its fixtures, and the exact refusal each rule produces.
    architecture: the committed ownership inventory and the documents describing it.
    adapter: an adapter against the interface the domain owns; proves the shape of the call, not the thing on the other end.
    mockintegration: the API end to end against the labelled mock adapter; certifies no provider.
    docs: published documentation, links, and the consistency of machine-readable strategy with its documents.
    cluster: needs a running Kubernetes cluster. Deselected by default.
    realruntime: needs the pinned model artifact and the pinned runtime image on a capable host. Deselected by default.
    failure: provokes a real failure against a real runtime. Deselected by default.
    load: sustained-load measurement. Deferred out of V1 and deselected by default.
