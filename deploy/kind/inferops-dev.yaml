# kind cluster definition for the InferOps local development environment.
#
# ADR 0001 (D2) selects kind, a single node, and a digest-pinned node image.
# The digest is authoritative; the tag beside it is a human-readable label and is
# not what the engine resolves. Change both together or not at all.
#
# The node image is deliberately a Kubernetes 1.34 build rather than the default
# for this kind release, so that the kubectl bundled with the container desktop
# application on the measured host stays inside the supported client/server skew
# of one minor version. See docs/environment/local-cluster.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: inferops-dev
nodes:
  - role: control-plane
    image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
