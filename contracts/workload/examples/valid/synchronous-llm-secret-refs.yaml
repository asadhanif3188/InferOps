# A shape example for the secret-reference block, and nothing more. It exists
# because a rule with no valid fixture behind it is a rule nobody has tested.
#
# Read it as: this is what a declared secret looks like. It is not a workload
# anyone runs, and the secrets it names do not exist. Every entry is a locator
# plus an owner plus a rotation responsibility; there is no field in the schema
# that a secret value could be written into, because every object is closed.
apiVersion: inferops.io/v1alpha1
kind: WorkloadContract

metadata:
  name: support-assistant-dev
  version: 0.1.0
  owner: team-platform-demo
  description: Shape example showing declared secret references. Not a deployed workload.
  annotations:
    inferops.io/example: secret-reference-shape

spec:
  profile: synchronous-llm
  environment: dev

  model:
    servingCapability: inferops-native-serving
    modelRef: qwen3-1-7b-q8-0
    runtimeProfile: resource-conscious

  resources:
    cpu: "6"
    memory: 3Gi
    accelerator:
      type: none
      count: 0

  scaling:
    minimumReplicas: 1
    maximumReplicas: 2

  integrations:
    telemetry:
      capabilityRef: platform-telemetry
      required: true

  security:
    dataClassification: confidential
    secretRefs:
      - name: model-registry-token
        provider: kubernetes-secret
        reference: inferops-serving/model-registry#token
        owner: team-platform-demo
        rotation: owner-managed
      - name: telemetry-ingest-key
        provider: external-secret
        reference: inferops/telemetry/ingest#key
        owner: team-platform-demo
        rotation: platform-managed

  attribution:
    tenant: demo
    costCenter: demo-cost-center

  evidence:
    runbookRef: docs/serving/feasibility-workflow.md

  synchronousLlm:
    runtime:
      imageReference: ghcr.io/ggml-org/llama.cpp@sha256:100de626bdc5b7df898c12561eefaf557019d2746d5fc8d3f4d7fd24e15ad384
    modelArtifact:
      repository: Qwen/Qwen3-1.7B-GGUF
      revision: 90862c4b9d2787eaed51d12237eafdfe7c5f6077
      file: Qwen3-1.7B-Q8_0.gguf
      sizeBytes: 1834426016
      sha256: sha256:061b54daade076b5d3362dac252678d17da8c68f07560be70818cace6590cb1a
