# The provenance a release of the committed synchronous WorkloadContract fixture,
# rendered with the committed local-docker-desktop EnvironmentBinding fixture,
# would carry.
#
# The identities are real: support-assistant 0.1.0 is the contract fixture's name
# and version, and local / local-docker-desktop is the binding fixture's identity.
# The digests and revisions are NOT: each is a repeated character, well formed and
# naming nothing, because no renderer has produced the values this release would
# describe. How a contract or a binding is hashed is decided in the contract
# document; these placeholders were kept on purpose, so that beside the documents
# it names the platform domain refuses this release for exactly its two digests.
# The release ID is the one the published rule derives from the values above it.
#
# This is a contract example. Nothing was rendered, installed, or run with it.
apiVersion: inferops.io/v1alpha1
kind: RenderedWorkloadRelease

metadata:
  workloadId: support-assistant
  workloadVersion: 0.1.0
  releaseId: c10f8012e8cf166e6d2ddb91d4b23a209ba26910fff8970c4cb5bb39a6a6d230

source:
  contract:
    apiVersion: inferops.io/v1alpha1
    sha256: "1111111111111111111111111111111111111111111111111111111111111111"
  environmentBinding:
    apiVersion: inferops.io/v1alpha1
    environment: local
    name: local-docker-desktop
    sha256: "2222222222222222222222222222222222222222222222222222222222222222"
  renderer:
    revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  platformDefaults:
    revision: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

output:
  helmValues:
    path: values.generated.yaml
    sha256: "3333333333333333333333333333333333333333333333333333333333333333"
