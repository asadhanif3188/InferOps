# The same contract rendered with the committed local-kind EnvironmentBinding
# fixture. Only the binding differs from the docker-desktop example - its name and
# the digest of its content - and so the release ID differs too, and so does the
# digest of the values it would produce.
#
# As in the other example, the identities are real and the digests and revisions
# are repeated characters that name nothing. The release ID is the one the
# published rule derives from the values above it.
#
# This is a contract example, not evidence about kind. Nothing was rendered,
# installed, or run with it.
