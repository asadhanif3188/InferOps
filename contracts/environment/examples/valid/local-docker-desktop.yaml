# The facts the reference environment supplies to a release: the Docker Desktop
# provider, the namespace the release lifecycle installs into, the model cache
# claim the prerequisite layer creates, and two platform API replicas. The first
# three values are copied from the record that owns each, and a test compares them,
# so a drift between this fixture and the environment it describes fails the build.
#
# The replica count is this binding's own decision: the V2 reference topology runs
# two API replicas. The V1 release ran one, and no release with two API replicas
# has been installed from this binding. A replica count is configuration. It does
# not establish that a caller is served while one API pod is lost.
#
# This is a contract example. The platform domain parses it, and one generated
# release is derived from it. The GitOps destination below is the directory that
# holds that release, under workloads/<workload id>/. One Application of the
# GitOps controller reads the generated values of that release, on a cluster
# where an operator applied the Application.
apiVersion: inferops.io/v1alpha1
kind: EnvironmentBinding

metadata:
  name: local-docker-desktop
  owner: platform-operations-demo

spec:
  environment: local

  destination:
    clusterProvider: docker-desktop
    namespace: inferops-release

  modelCache:
    class: existing-claim
    claimName: inferops-model-cache

  platform:
    apiReplicas: 2

  gitops:
    destinationPath: gitops/environments/local-docker-desktop
