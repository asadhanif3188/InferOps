{{- include "inferops-llm.validate" . -}}
{{- if .Values.security.serviceAccount.create }}
{{/*
`workload-service-account` in the ownership inventory: release-scoped, because
an identity that outlives what it identifies is a permission nobody is watching.

It is granted nothing. No Role and no RoleBinding is rendered, here or anywhere
in this chart, and no pod mounts its token. Least-privilege RBAC belongs to
V1-S3-004; this is the identity that story will constrain, and today it can do
nothing because nothing has been bound to it.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inferops-llm.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload-identity
  {{- $annotations := merge (dict) .Values.security.serviceAccount.annotations (include "inferops-llm.annotations" . | fromYaml) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
