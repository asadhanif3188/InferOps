{{- include "inferops-llm.validate" . -}}
{{- if .Values.security.serviceAccount.create }}
{{/*
`workload-service-account` in the ownership inventory: release-scoped, because
an identity that outlives what it identifies is a permission nobody is watching.

**Two accounts, one per workload.** Until V1-S3-004 this rendered one and both
Deployments named it. Neither was granted anything then and neither is granted
anything now -- no Role and no RoleBinding is rendered, here or anywhere in this
chart, and no pod mounts a token -- so the split changes no privilege today. It
changes what the first grant can reach: a RoleBinding written for the API and
attached to a shared account is a grant to the serving runtime as well, made by
somebody who was not thinking about the serving runtime.

That is the whole of the least-privilege property this chart can establish, and
it is worth being exact about its size. Two names that are granted nothing are
two names that are granted nothing. What is enforced is that the API pod and the
runtime pod present different identities and that neither presents one this
chart has bound a permission to; what is *not* established by the chart alone is
anything about a cluster's authorisation behaviour. The release that has since been
installed bound no permission to either account, so the property stays what it was:
two names that are granted nothing.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inferops-llm.api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload-identity
  {{- /* The derived map is the destination, because sprig gives the
       destination precedence. A colliding key is refused before this
       runs; the order is here so that the two guards are independent. */}}
  {{- $annotations := merge (include "inferops-llm.annotations" . | fromYaml) .Values.security.serviceAccount.annotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- if eq .Values.profile "real" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inferops-llm.runtime.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload-identity
  {{- $annotations := merge (include "inferops-llm.annotations" . | fromYaml) .Values.security.serviceAccount.annotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
