{{- include "inferops-llm.validate" . -}}
{{/*
`platform-api-deployment` in the ownership inventory.

The probes ask the two questions the accepted API surface record separates:
`/health/live` answers while the model is loading and while the API is draining,
and `/health/ready` is 503 while the API does not accept work. It does not
follow the selected adapter (ADR 0020). Liveness asks the first, readiness the
second, and neither is pointed at the other's path.

Shutdown is the order src/inferops/api/lifecycle.py fixes -- readiness false,
drain, exit -- with a preStop pause in front of it for the endpoint race, and a
grace period the template refuses unless it covers both.

The rollout strategy is stated, not left to the Kubernetes default. `api.rollout`
holds the two bounds in whole pods. The defaults allow no existing pod to be
taken away before its replacement is available, and one pod above the replica
count. That is a policy for a template change. It says nothing about a deleted
pod, a lost node, or an eviction.

Nothing here is evidence that this deployment runs. No InferOps API image is
published, and this chart has not been installed.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inferops-llm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
  {{- with (include "inferops-llm.annotations" . | fromYaml) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  progressDeadlineSeconds: {{ .Values.api.lifecycle.progressDeadlineSeconds }}
  {{- /* Stated rather than left to the Kubernetes default, which is 25% for
         both bounds: the pods that resolves to depend on the replica count. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ int .Values.api.rollout.maxUnavailable }}
      maxSurge: {{ int .Values.api.rollout.maxSurge }}
  selector:
    matchLabels:
      {{- include "inferops-llm.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inferops-llm.labels" . | nindent 8 }}
        app.kubernetes.io/component: platform-api
      annotations:
        {{- /* A configuration change must roll the pods; without this the
               ConfigMap changes and the running processes keep the old
               environment, which is a difference nothing would report. */}}
        inferops.io/configuration-checksum: {{ include "inferops-llm.derivedEnv" . | sha256sum }}
        {{- with (include "inferops-llm.scrapeAnnotations" (dict "context" $ "port" .Values.api.containerPort) | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with (include "inferops-llm.annotations" . | fromYaml) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "inferops-llm.api.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.api.lifecycle.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "inferops-llm.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "inferops-llm.api.image" . | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "inferops-llm.configMapName" . }}
          env:
            {{- include "inferops-llm.downwardEnv" . | nindent 12 }}
            {{- with (include "inferops-llm.secretEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (include "inferops-llm.api.probes" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with (include "inferops-llm.preStop" .Values.api.lifecycle | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          securityContext:
            {{- include "inferops-llm.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
