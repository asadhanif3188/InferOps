{{- include "inferops-llm.validate" . -}}
{{- if and .Values.telemetry.enabled .Values.telemetry.collection.enabled }}
{{/*
`telemetry-scrape-configuration` in the ownership inventory, and the row whose
honest description is that it is a document.

**What it holds.** Two keys. `scrape-config.yaml` is a Prometheus `scrape_configs`
fragment: one job for the platform API, and under the real profile a second for
the serving runtime, discovering pods by the Kubernetes labels this chart always
sets, scoped to this release's namespace and instance, and dropping on the way in
every label the accepted telemetry catalog bars from a metric.
`recording-rules.yaml` maps the native runtime series the catalog says map, and
publishes the absence of the signals that are missing.

**What it does not do.** It does not create a store, a dashboard, or an alerting
path. ADR 0006 D8 selects none of those and ADR 0004 still carries dashboards and
alert routing as unowned. What it no longer lacks is a reader: ADR 0004 D7 was
amended so that a collector is Helm-owned and release-scoped, and
`telemetry-collector.yaml` renders one that mounts this ConfigMap when
`telemetry.collection.collector.deploy` is set. With that off -- which is the
shipped default -- this is still inert.

**No workload mounts it.** Neither the API nor the runtime Deployment references
it, and that is deliberate: the workloads publish metrics, they do not collect
them, and a ConfigMap mounted into the pod it describes would suggest otherwise.
The collector reads it, and it reads *this* one rather than carrying a copy, so
a release cannot end up with two scrape configurations.

Nothing here is evidence that a metric was ever collected. This chart has not
been installed and this configuration has never been loaded by a running
Prometheus -- only checked by one, with `promtool`, which establishes that it
loads.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inferops-llm.telemetryScrapeConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-scrape-configuration
  {{- with (include "inferops-llm.annotations" . | fromYaml) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  scrape-config.yaml: |
    {{- include "inferops-llm.telemetryScrapeConfig" . | nindent 4 }}
  recording-rules.yaml: |
    {{- include "inferops-llm.telemetryRecordingRules" . | nindent 4 }}
{{- end }}
