{{- include "inferops-llm.validate" . -}}
{{- if eq .Values.profile "real" }}
{{/*
`serving-runtime-deployment` in the ownership inventory, and the reason the
mock profile is a smaller release rather than a differently configured one:
under `mock` this object is not rendered at all, so there is nothing an operator
could point at and describe as the serving runtime.

The arguments are the ones docs/serving/runtime-profile.local.v1.json publishes
and the feasibility trial actually ran. The model comes from a claim Terraform
owns, mounted read only -- **at the `<repository>/<revision>` subdirectory this
release derives**, so the declared revision decides which bytes are readable
rather than merely being recorded beside them. What fills the claim is
`model-acquisition-job`, which is Helm-owned, still `planned`, and still on the
chart's deferred list: it needs an image nobody has published and a 1.71 GiB
transfer, and both arrive with the Kubernetes serving integration.

Before `llama-server` starts, an init container reads the mounted artifact and
compares it against the pinned byte count and SHA-256. It runs on every pod
start, which is what makes it a restart property: a replacement pod
re-establishes that the surviving artifact is the one this release declared
before anything serves from it.

The probes are the asymmetry this chart exists to get right. `/health` answers
503 for the whole of a model load, so readiness and the startup gate ask it and
**liveness is a TCP connect** -- which is what
docs/serving/runtime-profile.local.v1.json publishes, and what the V1-S2-007
observation supports with 2,753 samples in which an HTTP liveness probe would
have been failing against a healthy loading process. The startup budget is the
measured load time with margin, and the kubelet runs neither of the other two
probes until it passes.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inferops-llm.runtimeServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: serving-runtime
  {{- with (include "inferops-llm.annotations" . | fromYaml) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.runtime.replicaCount }}
  progressDeadlineSeconds: {{ .Values.runtime.lifecycle.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "inferops-llm.runtime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inferops-llm.labels" . | nindent 8 }}
        app.kubernetes.io/component: serving-runtime
      annotations:
        inferops.io/configuration-checksum: {{ include "inferops-llm.derivedEnv" . | sha256sum }}
        {{- with (include "inferops-llm.scrapeAnnotations" (dict "context" $ "port" .Values.runtime.containerPort) | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with (include "inferops-llm.annotations" . | fromYaml) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "inferops-llm.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.runtime.lifecycle.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "inferops-llm.podSecurityContext" . | nindent 8 }}
      initContainers:
        {{- include "inferops-llm.model.verifyInitContainer" . | nindent 8 }}
      containers:
        - name: runtime
          image: {{ include "inferops-llm.runtime.image" . | quote }}
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          command:
            - {{ .Values.runtime.command | quote }}
          args:
            - --model
            - {{ include "inferops-llm.model.containerPath" . | quote }}
            - --alias
            - {{ .Values.model.alias | quote }}
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.runtime.containerPort | quote }}
            - --ctx-size
            - {{ .Values.runtime.contextSizeTokens | quote }}
            - --threads
            - {{ .Values.runtime.threads | quote }}
            - --parallel
            - {{ .Values.runtime.parallelSlots | quote }}
            - --n-predict
            - {{ .Values.runtime.defaultMaxOutputTokens | quote }}
            - --temp
            - {{ .Values.runtime.defaultTemperature | quote }}
            {{- if .Values.telemetry.enabled }}
            - --metrics
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.runtime.containerPort }}
              protocol: TCP
          {{- with .Values.runtime.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "inferops-llm.runtime.probes" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with (include "inferops-llm.preStop" .Values.runtime.lifecycle | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          securityContext:
            {{- include "inferops-llm.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.runtime.resources | nindent 12 }}
          volumeMounts:
            {{- include "inferops-llm.model.volumeMount" . | nindent 12 }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            {{- /* Terraform provisions this claim. Referencing is not owning,
                   and this chart renders no PersistentVolumeClaim. */}}
            claimName: {{ .Values.model.cache.claimName }}
            readOnly: true
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ printf "%dMi" (int .Values.runtime.temporaryFilesystemSizeMi) }}
      {{- with .Values.runtime.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtime.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtime.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
