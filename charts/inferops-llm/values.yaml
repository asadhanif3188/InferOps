# Default values for the inferops-llm chart.
#
# Read the two rules below before changing anything here.
#
# 1. `profile` has no default. It is `mock` or `real`, it must be stated, and an
#    omission renders nothing - it is refused. This mirrors
#    `INFEROPS_SERVING_ADAPTER` in src/inferops/api/selection.py, which is
#    required with no default and no fallback for the same reason: rule 5 of
#    docs/serving/mock-and-real-boundary.md says a mock may never be what the
#    mandatory serving path gets by omission. A chart whose default installed a
#    mock would hand out one per `helm install` rather than one per test.
#
# 2. Nothing here carries a secret value. Secret material is referenced by name
#    through `security.secretRefs` and read from Kubernetes at run time. The
#    schema refuses a literal, and so does the template.

# -- which serving path this release installs -------------------------------
#
# `mock`  the API alone, serving the committed fixture replayer. It installs no
#         runtime, mounts no model, and may not carry a real pin. It certifies
#         nothing about serving.
# `real`  the API and the ADR 0002 runtime, reading the model from a cache claim
#         Terraform owns.
#
# Empty is not `mock`. Empty is a refusal.
profile: ""

# -- naming and placement ---------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# The release namespace must already exist and must be prefixed `inferops-`
# (ADR 0001 D5). Terraform creates it; this chart installs into it and never
# creates it. Set to false only to install into a namespace whose name a future
# decision changes; the prefix check is the isolation rule, not a style rule.
namespacePrefixCheck: true

# -- the platform API -------------------------------------------------------
api:
  replicaCount: 1

  image:
    # No InferOps image is published. `platform-api-container-image` is
    # `planned` in the ownership inventory, no Dockerfile is committed, and this
    # value therefore has no default that would resolve. State the repository
    # and the digest of an image you built and loaded into the cluster.
    repository: ""
    # Digest only. A tag is a label that can be moved; a digest is what the
    # engine resolves. The schema refuses anything that is not `sha256:` and
    # sixty-four hexadecimal characters.
    digest: ""
    pullPolicy: IfNotPresent

  # The port the API listens on inside the pod, and the port its Service
  # publishes. ClusterIP only: V1 installs no ingress controller and no load
  # balancer (ADR 0001 D2), so external access is an explicit port-forward.
  containerPort: 8090
  service:
    port: 8090
    annotations: {}

  # docs/serving/inference-api-surface.v1alpha1.json publishes both paths.
  readinessPath: /health/ready
  livenessPath: /health/live

  # Probes, and the mapping docs/serving/inference-api-surface.v1alpha1.json
  # publishes. `/health/live` answers while the model is loading and while the
  # API is draining; `/health/ready` is false whenever either the API or the
  # selected adapter is unable. Liveness asks the first and readiness the
  # second, and neither is ever pointed at the other's path - pointing liveness
  # at a readiness answer is the defect the feasibility trial found on the
  # runtime, and it is the same defect wherever it is written.
  #
  # `startup.budgetMs` is a budget rather than a count: failureThreshold is
  # derived from it and periodSeconds, so the arithmetic cannot drift from the
  # intent. Until a startup probe succeeds the kubelet runs neither of the other
  # two, which is what stops a slow start being read as a failure.
  probes:
    enabled: true
    startup:
      # The API binds its port as soon as the process is up. It does not wait
      # for the runtime: adapter readiness is asked per request rather than at
      # start-up, so this budget covers a slow image start and not a model load.
      budgetMs: 60000
      periodSeconds: 5
      timeoutSeconds: 2
    readiness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

  requestTimeoutMs: 120000
  maxOutputTokens: 128
  drainTimeoutMs: 15000

  # Shutdown, in the order src/inferops/api/lifecycle.py fixes: readiness goes
  # false, what is in flight drains, the process exits.
  #
  # `preStopSleepSeconds` is here because endpoint removal is asynchronous. The
  # kubelet sends SIGTERM and the EndpointSlice update races it, so without a
  # pause a pod can be handed work after it stopped accepting any. It is a
  # `sleep` action rather than an `exec`: an `exec` needs a shell inside the
  # image, and no InferOps image exists yet to be asked whether it has one.
  #
  # The grace period has to cover the pause and the drain together. The template
  # refuses a value that does not, because a period that expires mid-drain ends
  # in SIGKILL and the drain the API performed was then decoration.
  lifecycle:
    preStopSleepSeconds: 5
    terminationGracePeriodSeconds: 30
    # How long a rollout may make no progress before Kubernetes declares it
    # failed. It has a default -- 600 seconds -- and leaving it at the default
    # is the defect this field exists to prevent: the default is not derived
    # from the startup budget, so a container the kubelet is still patiently
    # waiting for can belong to a rollout the Deployment controller has already
    # given up on, and an install waiting on that rollout reports a failure that
    # is a slow start. The template refuses a value inside the startup budget.
    progressDeadlineSeconds: 300

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Extra environment for the API container. Every name the chart derives is
  # reserved: supplying one here is refused rather than merged, because the
  # merge order is exactly how a real release would come to publish `mock` - or
  # the reverse.
  extraEnv: []

# -- the serving runtime (profile: real only) -------------------------------
runtime:
  replicaCount: 1

  image:
    # Pinned by digest to the image ADR 0002 selected and the feasibility trial
    # actually ran. Kept identical to
    # deploy/serving/runtime/container-package.v1.json; a test compares them.
    repository: ghcr.io/ggml-org/llama.cpp
    digest: sha256:100de626bdc5b7df898c12561eefaf557019d2746d5fc8d3f4d7fd24e15ad384
    pullPolicy: IfNotPresent

  command: /app/llama-server
  containerPort: 8080
  service:
    port: 8080
    annotations: {}

  # docs/serving/runtime-profile.local.v1.json publishes these.
  contextSizeTokens: 4096
  threads: 6
  parallelSlots: 1
  defaultMaxOutputTokens: 128
  defaultTemperature: 0
  startupBudgetMs: 300000

  healthPath: /health

  # The mapping docs/serving/runtime-profile.local.v1.json publishes, and the
  # reason it is not the obvious one: `/health` answers 503 while the model
  # loads. That is correct readiness behaviour and wrong liveness behaviour, so
  # liveness is a TCP connect and never an HTTP GET. The record's own
  # `health.liveness.kind` is `tcp`; a test compares the chart against it.
  #
  # The startup budget is 600,000 ms and not the 300,000 ms `startupBudgetMs`
  # publishes, because the measured loads do not fit inside the smaller number.
  # V1-S2-007 recorded 133,515 ms to 215,906 ms across six starts, and the
  # V1-S2-005 first attempt recorded 358,735 ms cold and 284,406 ms warm on the
  # same host; its later recorded run loaded in 269,079 ms. A probe budgeted
  # at 300,000 ms would have killed the container mid-load in the slowest of
  # those and restarted it into the same load. The two numbers measure different
  # things - one is how long the adapter waits for the runtime, the other how
  # long the kubelet waits for the container - and the template refuses a startup
  # budget below the adapter's, because a kubelet that gives up first makes the
  # adapter's budget unreachable.
  probes:
    enabled: true
    startup:
      budgetMs: 600000
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  # `llama-server` has no drain protocol: it is stopped rather than asked to
  # finish. V1-S2-007 measured stop-and-remove at 1,234 ms to 1,672 ms across six
  # starts, so thirty seconds is not a tuned figure - it is an obviously
  # sufficient one. The pause is for the same endpoint race as the API's.
  lifecycle:
    preStopSleepSeconds: 5
    terminationGracePeriodSeconds: 30
    # 900 rather than the 600-second default, because the startup budget alone
    # is 600 and a rollout still pulling a runtime image has made no progress
    # the controller can see. The margin is for the pull and the scheduling, and
    # it is a budget rather than a measurement: nothing here has pulled an image
    # into a cluster.
    progressDeadlineSeconds: 900

  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "6"
      memory: 3Gi

  # A writable scratch directory, because the root filesystem is read only.
  temporaryFilesystemSizeMi: 64

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -- the model --------------------------------------------------------------
#
# Required under `real`, and refused under `mock`: a mock loads no weights, and
# a mock release that carried a revision would read back as one that had.
model:
  # The platform identifier the API checks a caller's `model` member against.
  identifier: ""
  # The immutable upstream revision. An identifier alone pins nothing.
  revision: ""
  alias: ""

  # The upstream artifact, pinned the way docs/serving/model-source.v1.json pins
  # it: a repository, a file, a byte count, and a content hash. A test compares
  # the real fixture against that record, so a drift here fails the build.
  #
  # `repository` and `revision` are what the in-claim location is derived from,
  # and that derivation is the point of this block rather than a convenience.
  # See `cache` below.
  artifact:
    # The upstream repository, `owner/name`.
    repository: ""
    # The file inside it. One path segment; the runtime loads GGUF and nothing
    # else, so the suffix is refused rather than assumed.
    fileName: ""
    # What the bytes must weigh, and what they must hash to. Both are checked
    # inside the pod before the runtime starts -- see `integrity` below -- so
    # they are load-bearing values and not documentation.
    sizeBytes: 0
    sha256: ""

  cache:
    # The name of an existing PersistentVolumeClaim. Terraform owns the claim
    # (`model-cache-volume-claim`); this chart mounts it read only and never
    # creates it. Referencing is not owning.
    claimName: ""

    # The directory the artifact appears in inside the container. The file path
    # the runtime is given is derived from this and `artifact.fileName`, and is
    # settable nowhere: a path the operator typed and a path the integrity check
    # read could otherwise be two different files.
    mountPath: /models

    # There is deliberately no `subPath` here.
    #
    # The claim is mounted at a subdirectory derived from `artifact.repository`
    # and `revision` -- the same `<repository>/<revision>/` layout the workspace
    # cache already uses -- so a release declaring one revision cannot be handed
    # the bytes of another. A free-form subPath was the hole: `revision` was
    # required, checked against nothing, and had no bearing on which bytes the
    # container actually read. It now decides the mount, so cache reuse cannot
    # bypass the revision it claims to be reusing.
    readOnly: true

  # What is checked inside the pod, before `llama-server` is started, on every
  # start and therefore on every restart.
  #
  # `sha256`  read the artifact end to end and compare its digest and its byte
  #           count against the pins above. This is the default. It costs one
  #           full read of the artifact per pod start -- roughly 1.71 GiB for
  #           the selected model -- against a model load this project has
  #           measured at 129,328 ms to 358,735 ms, so it is a minority of a
  #           start rather than a new order of cost.
  # `size`    compare the byte count only. Cheap, and weak: it catches a
  #           truncated or absent artifact and nothing else.
  # `none`    read no content. The artifact still has to be there: the
  #           file-exists refusal is not part of the mode, because a pod that
  #           started a runtime on a missing file would crash-loop for a reason
  #           nobody could read off the pod. The revision scoping also still
  #           holds, because it is the mount rather than a check.
  #
  # Required to be `none` under the mock profile, where nothing is mounted and
  # there is no artifact to read. A mock stating `sha256` would describe a
  # verification that never happened.
  integrity:
    verifyOnStart: sha256

    image:
      # BusyBox, for its `sha256sum` and its `wc`. It is the same pinned image
      # `tests.image` uses, which is the same `busybox:1.37.0` index digest four
      # committed manifests under deploy/ already pin; a test compares all of
      # them so that one pin cannot become several.
      repository: docker.io/library/busybox
      digest: sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 50m
        memory: 16Mi
      limits:
        cpu: "1"
        memory: 64Mi

# -- ownership and attribution ----------------------------------------------
#
# These become labels on every object and identity on everything the API emits.
#
# The serving capability is NOT here. It is derived from `profile`, in the same
# place and for the same reason the adapter kind is: `inferops-native-serving`
# and `inferops-mock-serving` are disjoint by design, and a second value
# carrying that label would be a way to install a mock and publish the real
# capability - or the reverse.
ownership:
  # The team accountable for the workload. DNS-safe, because it is a label value.
  owner: ""
  # The workload this release serves, and the version of its contract document.
  workloadId: ""
  workloadVersion: ""
  # Attribution. `tenant` and `costCenter` are annotations rather than labels:
  # docs/telemetry/redaction.md keeps a tenant identifier out of anything a
  # selector groups by, and a label is exactly that.
  tenant: ""
  costCenter: ""

commonLabels: {}
commonAnnotations: {}

# -- telemetry --------------------------------------------------------------
telemetry:
  # Whether the runtime exposes its own metrics endpoint, and whether the API
  # publishes its metrics port on the Service.
  enabled: true
  metricsPath: /metrics
  # The environment label every emitted record carries. `dev` is the
  # conservative default and the one environment V1 has: a figure from a laptop
  # that defaulted to `dev` is never read as a figure from somewhere else.
  deploymentEnvironment: dev
  # The build of the API this release installs. Empty rather than `unknown`: an
  # unstated identity is empty and never invented.
  serviceVersion: ""
  # Whether every pod carries `prometheus.io/scrape`, `prometheus.io/port`, and
  # `prometheus.io/path`. Off by default, and inert either way: nothing in this
  # project collects anything, no scrape resource is rendered, and
  # `telemetry-scrape-configuration` stays deferred to V1-S3-007. The
  # annotations are here because they are the one form of scrape configuration
  # that is a field on the workload rather than a resource beside it, so a
  # discovery mechanism that reads them can find these pods without this chart
  # deciding what that mechanism is. Requires `enabled`: annotating a port that
  # serves no metrics is refused rather than rendered.
  #
  # `inert` describes this environment rather than the annotation. These are the
  # legacy Prometheus auto-discovery keys, so a cluster-wide Prometheus using
  # that convention would start scraping without anything here asking it to, and
  # /metrics is unauthenticated (docs/security/deferred-risks.md, DR-01).
  scrapeAnnotations: false

# -- the chart's own test ----------------------------------------------------
#
# `helm test` runs one pod that asks each Service this release renders for its
# health endpoint and exits non-zero if either does not answer.
#
# It is a hook, which means three things a reader should not have to infer: it
# is not part of the installed release, it is created by `helm test` and deleted
# when it succeeds, and it appears in `helm template` output because Helm
# renders hooks alongside everything else.
#
# It has never been run. No cluster has installed this chart.
tests:
  enabled: true
  image:
    # BusyBox, for its `wget`. It is the only image here that is neither the
    # InferOps API nor the runtime ADR 0002 pinned, and it is not a new
    # dependency: this is the same `busybox:1.37.0` index digest four committed
    # manifests under deploy/ already pin, and a test compares them so that two
    # copies of one pin cannot drift into two pins.
    repository: docker.io/library/busybox
    digest: sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    pullPolicy: IfNotPresent
  # Per request, not for the whole test. `helm test` has already waited for the
  # release; a Service that does not answer in ten seconds is not slow, it is
  # not there.
  timeoutSeconds: 10
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# -- security ---------------------------------------------------------------
#
# The pod and container fields below are the six properties every workload
# manifest in this repository already carries. V1-S3-004 owns enforcement - the
# policy validation, the least-privilege service account, and the NetworkPolicy.
# This chart configures them; it does not prove that a cluster refused a
# workload that omitted them.
security:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

  serviceAccount:
    # Created by this release and named for it: an identity that outlives what
    # it identifies is a permission nobody is watching.
    create: true
    name: ""
    annotations: {}

  # Secret material, by reference only. The chart mounts nothing and reads
  # nothing; it names Kubernetes Secrets the workload owner created out of band.
  # A literal value here is refused by the schema and by the template.
  #
  # These reach the API container and nothing else. The runtime container gets no
  # environment at all: llama.cpp reads none, its configuration is its argument
  # vector, and a variable it ignores would suggest it read one.
  secretRefs: []
