apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferops-inferops-llm
  namespace: inferops-platform
  labels:
    helm.sh/chart: inferops-llm-0.1.0
    app.kubernetes.io/name: inferops-llm
    app.kubernetes.io/instance: inferops
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: inferops
    inferops.io/lifecycle: release
    inferops.io/profile: mock
    inferops.io/owner: team-platform-demo
    inferops.io/workload: support-assistant-mock
    app.kubernetes.io/component: platform-api
  annotations:
    inferops.io/cost-center: demo-cost-center
    inferops.io/tenant: demo
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: inferops-llm
      app.kubernetes.io/instance: inferops
      app.kubernetes.io/component: platform-api
  template:
    metadata:
      labels:
        helm.sh/chart: inferops-llm-0.1.0
        app.kubernetes.io/name: inferops-llm
        app.kubernetes.io/instance: inferops
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: inferops
        inferops.io/lifecycle: release
        inferops.io/profile: mock
        inferops.io/owner: team-platform-demo
        inferops.io/workload: support-assistant-mock
        app.kubernetes.io/component: platform-api
      annotations:
        inferops.io/configuration-checksum: 1698497a11d47235aed1b76f114b21fcbeb3eb3b9eaa5c9465159e1a4eaeab6f
        inferops.io/cost-center: demo-cost-center
        inferops.io/tenant: demo
    spec:
      serviceAccountName: inferops-inferops-llm
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "localhost/inferops-api@sha256:7961c9f9ce773095461498774bc2f25053bcba6d01c40d8448da65e217091e50"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: inferops-inferops-llm-configuration
          env:
            - name: INFEROPS_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
