apiVersion: v1
kind: Pod
metadata:
  name: inferops-inferops-llm-connection-test
  namespace: inferops-platform
  labels:
    helm.sh/chart: inferops-llm-0.1.0
    app.kubernetes.io/name: inferops-llm
    app.kubernetes.io/instance: inferops
