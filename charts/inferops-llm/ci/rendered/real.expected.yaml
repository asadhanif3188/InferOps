# Source: inferops-llm/templates/telemetry-scrape-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: inferops-inferops-llm-telemetry-scrape
  namespace: inferops-platform
  labels:
    helm.sh/chart: inferops-llm-0.3.0
    app.kubernetes.io/name: inferops-llm
    app.kubernetes.io/instance: inferops
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: inferops
    inferops.io/lifecycle: release
    inferops.io/profile: real
    inferops.io/owner: team-platform-demo
    inferops.io/workload: support-assistant
    app.kubernetes.io/component: telemetry-scrape-configuration
  annotations:
    inferops.io/cost-center: demo-cost-center
    inferops.io/tenant: demo
data:
  scrape-config.yaml: |
    scrape_configs:
      - job_name: inferops-inferops-llm-platform-api
        scheme: http
        metrics_path: "/metrics"
        scrape_interval: 30s
        scrape_timeout: 10s
        # Stated rather than left to the default, because it is the whole reason the
        # relabelling below adds no label the API already publishes.
        honor_labels: false
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: false
              names:
                - inferops-platform
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_part_of
              - __meta_kubernetes_pod_label_app_kubernetes_io_instance
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            separator: ";"
            action: keep
            regex: "inferops;inferops;platform-api"
          - source_labels:
              - __meta_kubernetes_pod_container_port_number
            action: keep
            regex: "8090"
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: k8s_namespace
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            target_label: k8s_component
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: instance
        metric_relabel_configs:
          - action: labeldrop
            regex: "(http_response_status_code|inferops_correlation_id|inferops_cost_record_id|inferops_duration_ms|inferops_evaluation_decision|inferops_event|inferops_field_path|inferops_finish_reason|inferops_owner_id|inferops_request_id|inferops_retry_count|inferops_tenant_id|inferops_workload_version|k8s_pod_name|level|service_name|span_id|timestamp|trace_id)"
      - job_name: inferops-inferops-llm-serving-runtime
        scheme: http
        metrics_path: "/metrics"
        scrape_interval: 30s
        scrape_timeout: 10s
        honor_labels: false
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: false
              names:
                - inferops-platform
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_part_of
              - __meta_kubernetes_pod_label_app_kubernetes_io_instance
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            separator: ";"
            action: keep
            regex: "inferops;inferops;serving-runtime"
          - source_labels:
              - __meta_kubernetes_pod_container_port_number
            action: keep
            regex: "8080"
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: k8s_namespace
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            target_label: k8s_component
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: instance
          # The runtime publishes bare series. These four are the operating dimensions
          # the catalog permits as metric labels, and the collector is the only thing
          # positioned to supply them.
          - target_label: deployment_environment
            replacement: "dev"
          - target_label: inferops_workload_id
            replacement: "support-assistant"
          - target_label: inferops_model_id
            replacement: "qwen3-1-7b-q8-0"
          - target_label: inferops_runtime_id
            replacement: "llama-cpp-server"
        metric_relabel_configs:
          - action: labeldrop
            regex: "(http_response_status_code|inferops_correlation_id|inferops_cost_record_id|inferops_duration_ms|inferops_evaluation_decision|inferops_event|inferops_field_path|inferops_finish_reason|inferops_owner_id|inferops_request_id|inferops_retry_count|inferops_tenant_id|inferops_workload_version|k8s_pod_name|level|service_name|span_id|timestamp|trace_id)"
  recording-rules.yaml: |
    groups:
      - name: inferops-runtime-metric-mapping
        interval: 30s
        rules:
          # llamacpp:prompt_tokens_total and llamacpp:tokens_predicted_total are the two
          # native counters the catalog maps to inferops_inference_tokens_total. The
          # direction label is what distinguishes them, exactly as it does on the metric
          # the API emits.
          - record: inferops:inference_tokens:runtime_total
            expr: |
              label_replace(llamacpp:prompt_tokens_total, "inferops_token_direction", "input", "", "")
              or
              label_replace(llamacpp:tokens_predicted_total, "inferops_token_direction", "output", "", "")
          - record: inferops:inference_requests_in_flight:runtime
            expr: llamacpp:requests_processing
          # Partial, and named so that it cannot be read as the queue histogram.
          # llamacpp:requests_deferred shows that queueing happened and never how long
          # any request waited; the wait is the adapter's measurement, and the adapter is
          # not instrumented.
          - record: inferops:inference_requests_deferred:runtime
            expr: llamacpp:requests_deferred
      - name: inferops-collection-health
        interval: 30s
        rules:
          - record: inferops:scrape_targets:count
            expr: count by (job, k8s_namespace, k8s_component) (up{job=~"inferops-inferops-llm-platform-api|inferops-inferops-llm-serving-runtime"})
          # sum rather than a count over a filtered vector: a job whose every target is
          # down must read zero here, and a count over an empty vector reads nothing.
          - record: inferops:scrape_targets_up:sum
            expr: sum by (job, k8s_namespace, k8s_component) (up{job=~"inferops-inferops-llm-platform-api|inferops-inferops-llm-serving-runtime"})
          - record: inferops:scrape_job_absent:platform_api
            expr: absent(up{job="inferops-inferops-llm-platform-api"})
          - record: inferops:scrape_job_absent:serving_runtime
            expr: absent(up{job="inferops-inferops-llm-serving-runtime"})
          # The API answered a scrape and published no identity: a target that is up and
          # useless, which `up` alone cannot tell from one that is up and correct.
          #
          # Scoped to this release's namespace and tier for the same reason the jobs are
          # named for the release: an unscoped absent() over a store holding two releases
          # reads 0 as soon as either one of them publishes an identity.
          - record: inferops:build_info_absent:platform_api
            expr: absent(inferops_build_info{k8s_namespace="inferops-platform", k8s_component="platform-api"})
          # Reads 1 until the adapter the catalog assigns this metric to emits it.
          - record: inferops:model_ready_absent:platform_api
            expr: absent(inferops_model_ready{k8s_namespace="inferops-platform", k8s_component="platform-api"})
