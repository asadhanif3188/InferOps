# The real profile, as a render fixture.
#
# This file is an input to `helm lint` and `helm template` and to
# tests/architecture/test_helm_chart.py. It is not a deployable values file and
# installing from it would fail on the first image pull, for one reason stated
# plainly here rather than discovered later:
#
#   `api.image.digest` is a PLACEHOLDER. It is the SHA-256 of the ASCII string
#   `inferops-api-image-not-yet-published`, which anyone can recompute, and no
#   image with that digest exists in any registry. The value is here because the
#   chart refuses an unpinned image, and a fixture that satisfied the refusal
#   with a movable tag would have taught the render check to accept one.
#
#   An image can now be built: `deploy/api/Dockerfile` is committed and
#   `scripts/environment/api-image.sh` builds it, loads it into the node and
#   verifies the reference resolves there. It stays a placeholder because that
#   image is published to no registry, so its manifest digest describes one
#   contributor's build rather than this repository. `api-image.sh values`
#   writes the real one into an overlay under `.artifacts/`, which version
#   control ignores. Deploy with both files:
#     helm install ... -f charts/inferops-llm/ci/real-values.yaml #                      -f .artifacts/api-image-values.yaml
#
# Every other pinned value is real and is copied from the accepted records: the
# runtime digest from ADR 0002 and deploy/serving/runtime/container-package.v1.json,
# the model revision from docs/serving/model-source.v1.json, and the runtime
# settings from docs/serving/runtime-profile.local.v1.json. A test compares them,
# so a drift between this fixture and an accepted decision fails the build rather
# than sitting here unread.

profile: real

api:
  image:
    repository: localhost/inferops-api
    digest: sha256:7961c9f9ce773095461498774bc2f25053bcba6d01c40d8448da65e217091e50
    pullPolicy: Never

runtime:
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    digest: sha256:100de626bdc5b7df898c12561eefaf557019d2746d5fc8d3f4d7fd24e15ad384
    pullPolicy: IfNotPresent

model:
  identifier: qwen3-1-7b-q8-0
  revision: 90862c4b9d2787eaed51d12237eafdfe7c5f6077
  alias: qwen3-1.7b-q8_0
  # Every member below is copied from docs/serving/model-source.v1.json, and a
  # test compares them. The repository and the revision derive the
  # subdirectory of the claim this release mounts, so they are what decides
  # which bytes the container can read.
  artifact:
    repository: Qwen/Qwen3-1.7B-GGUF
    fileName: Qwen3-1.7B-Q8_0.gguf
    sizeBytes: 1834426016
    sha256: sha256:061b54daade076b5d3362dac252678d17da8c68f07560be70818cace6590cb1a
    sourceUrl: https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/90862c4b9d2787eaed51d12237eafdfe7c5f6077/Qwen3-1.7B-Q8_0.gguf?download=true

  license:
    spdx: Apache-2.0
    reference: https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/blob/90862c4b9d2787eaed51d12237eafdfe7c5f6077/LICENSE

  # `download` and not `seed-image`, because this file is the one a fresh
  # checkout renders and everything it needs is public and pinned: the URL, the
  # byte count and the hash all come from docs/serving/model-source.v1.json.
  #
  # A seed image is faster on a host that already holds the artifact -- and this
  # host does -- but its digest describes one machine's build rather than this
  # repository, so it belongs in an overlay rather than here, exactly like the
  # API image digest. scripts/environment/model-seed-image.sh prints one.
  acquisition:
    enabled: true
    source: download
  cache:
    claimName: inferops-model-cache
    mountPath: /models
    readOnly: true
  # Stated rather than left implicit, so that the strong setting appears in a
  # committed render. Nothing has run it: no cluster has installed this chart.
  integrity:
    verifyOnStart: sha256

ownership:
  owner: team-platform-demo
  workloadId: support-assistant
  workloadVersion: 0.1.0
  tenant: demo
  costCenter: demo-cost-center

telemetry:
  enabled: true
  deploymentEnvironment: dev
  # On here and off in the mock fixture, so that both branches of the annotation
  # appear in a committed render rather than only the one the default takes.
  # They are inert: nothing in this project scrapes anything.
  scrapeAnnotations: true
  collection:
    collector:
      # The collector this release installs, which is what makes the scrape
      # configuration beside it do something. ADR 0004 D7 was resolved for this
      # and nothing else: no dashboard, no alert receiver, no routing tree.
      deploy: true
