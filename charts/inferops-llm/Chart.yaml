# The InferOps LLM release: the platform API and, under the real profile, the
# serving runtime ADR 0002 selected, installed as one release.
#
# This chart owns the release layer and nothing else. The namespace it installs
# into, that namespace's metadata, and the model cache claim are Terraform's,
# per the accepted boundary in docs/architecture/resource-ownership.md, and this
# chart renders none of them. `--create-namespace` is forbidden.
apiVersion: v2
name: inferops-llm
description: The InferOps platform API and its serving runtime, as one release.
type: application

# The chart's own version. It is not the platform version and not the model
# version: the API build is `api.image`, the runtime build is `runtime.image`,
# and the model is `model.revision`. Three separate pins, because a single
# number covering all of them would be the thing that hides a change.
#
# 0.3.0 rather than 0.2.1: V1-S3-007 renders a resource this chart did not render
# before -- the telemetry scrape ConfigMap -- and adds `telemetry.collection` to
# the values contract. A values file written against 0.2.0 still installs, because
# every new member has a default, but the render is not the same one, and the bump
# is for the reader who compares two renders. (0.2.0 was V1-S3-004's, for the same
# reason: it rendered resources 0.1.0 did not and changed the shape of
# `security.serviceAccount`. Nothing has installed any of them, so no upgrade path
# is owed to anyone.)
version: 0.3.0

# What this chart installs, when the API image exists to install. No InferOps
# image is published: `platform-api-container-image` is `planned` in the
# ownership inventory, and although `deploy/api/Dockerfile` now builds one, it is
# loaded into a node rather than pushed anywhere. So `appVersion` names the
# repository revision the templates were written against rather than a release
# nobody can pull.
appVersion: "0.1.0"

kubeVersion: ">=1.34.0-0"

keywords:
  - inferops
  - llm
  - inference

home: https://github.com/asadhanif3188/InferOps
sources:
  - https://github.com/asadhanif3188/InferOps

annotations:
  # The ownership inventory rows this chart is allowed to render. A reviewer
  # reads this list against docs/architecture/resource-ownership.v1alpha1.json,
  # and tests/architecture/test_helm_chart.py reads it for them.
  inferops.io/owned-resources: >-
    workload-service-account,workload-network-policy,platform-api-deployment,
    platform-api-service,serving-runtime-deployment,serving-runtime-service,
    runtime-configuration,telemetry-scrape-configuration,model-acquisition-job,
    telemetry-collector
  inferops.io/deferred-resources: ""
