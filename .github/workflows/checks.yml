# The default-checks lane, automated.
#
# ADR 0005 D2 defines four lanes and says the one every change goes through
# downloads no model, touches no cluster, and needs nobody's authorization.
# ADR 0012 selects the service that runs it, and this file is what that decision
# names: every job here is a gate in docs/testing/ci-gate-matrix.md, and
# tests/testing/test_ci_gate_matrix.py compares the two in both directions, so a
# job added here without a matrix row - or a row without a job - fails the build
# that introduced it.
#
# Three properties of this file are enforced by that suite rather than promised
# here:
#
#   * no step reaches a Kubernetes cluster. There is no kubectl, no helm, no
#     terraform, no kind, and no provider selection anywhere in this workflow,
#     and a check refuses one arriving later. Real Kubernetes work is opt-in,
#     provider-selected and target-verified, and it does not live in this lane.
#   * no step downloads the pinned model artifact. The lane's whole premise is
#     that it costs nothing to run on every change, and 1.71 GiB of weights on
#     every push is the cost nobody pays twice.
#   * every third-party action is pinned by commit SHA. A tag is a name somebody
#     can move, which is the same argument the manifests here make for pinning
#     an image by digest.
#
# What this lane may certify is C0 and C1 and nothing above it: every job reads
# files in this repository or drives the deterministic mock. A green run here is
# not evidence that a runtime serves anything.

name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. Nothing in this lane publishes a package, writes a comment, pushes
# a tag, or needs a token that could.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # The lane is reproducible only if the interpreter is. `.python-version` says
  # 3.12 and `pyproject.toml` requires `>=3.12,<3.13`; this is the same
  # statement in the one place the runner reads.
  UV_PYTHON: "3.12"

jobs:
  code-quality:
    name: format, lint, and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install the locked toolchain
        run: uv sync --locked
      - name: Formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Types
        run: uv run --locked python -m mypy

  default-lane-tests:
    name: default-lane test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install the locked toolchain
        run: uv sync --locked
      # No marker expression. That is the point: pytest.ini's default already
      # deselects `cluster`, `realruntime`, `failure`, and `load`, so the lane
      # is defined by the committed configuration rather than by an argument
      # somebody could change here without changing the strategy.
      - name: Run the default lane
        run: uv run --locked python -m pytest -q

  expected-failures:
    name: expected-failure controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install the locked toolchain
        run: uv sync --locked
      # Runs the published commands from a shell and reads their exit status,
      # which is the only thing a gate can read. The positive controls in the
      # same run are what stops a validator that refused everything passing it.
      - name: Invalid contracts and insecure manifests are refused
        run: uv run --locked python -m tools.ci_gates expected-failures

  documentation:
    name: documentation links and whitespace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install the locked toolchain
        run: uv sync --locked
      - name: Every relative link resolves
        run: uv run --locked python -m pytest tests/testing/test_document_links.py -q
      # The verdict is taken from the output, not from the exit status. `xargs`
      # reports 123 rather than grep's own 0 or 1 the moment the file list is
      # long enough to need a second invocation, and `if ...; then` reads 123 as
      # "no match" - so a real finding in one batch would pass the gate in
      # silence. This repository is nowhere near that boundary today, which is
      # exactly why the failure would arrive unannounced.
      - name: No trailing whitespace in a published document
        run: |
          set -uo pipefail
          found=$(git ls-files -z '*.md' | xargs -0 grep -n '[[:blank:]]$' || true)
          if [ -n "${found}" ]; then
            echo "${found}"
            echo "::error::a published document carries trailing whitespace"
            exit 1
          fi
      # `grep -n "$(printf '\t')"` and not `grep -nP '\t'`: the second needs a
      # PCRE build and refuses to run outside a unibyte or UTF-8 locale, which
      # is a portability failure rather than a finding. This is the form
      # CONTRIBUTING publishes, so the gate and the document run one check.
      - name: No hard tab in a published document
        run: |
          set -uo pipefail
          found=$(git ls-files -z '*.md' | xargs -0 grep -n "$(printf '\t')" || true)
          if [ -n "${found}" ]; then
            echo "${found}"
            echo "::error::a published document carries a hard tab"
            exit 1
          fi

  distribution-build:
    name: distribution build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Build the wheel and the source distribution
        run: uv build
      # The sdist include list in pyproject.toml is anchored to the repository
      # root because an unanchored `README.md` matches at every depth and the
      # distribution quietly acquires eight documentation files. This is that
      # comment made into a check.
      - name: The source distribution carries one README and no documentation tree
        run: |
          set -euo pipefail
          sdist=$(ls dist/*.tar.gz)
          echo "inspecting ${sdist}"
          contents=$(tar -tzf "${sdist}")
          echo "${contents}"
          readmes=$(echo "${contents}" | grep -c '/README.md$' || true)
          if [ "${readmes}" -ne 1 ]; then
            echo "::error::the source distribution carries ${readmes} README.md files, expected 1"
            exit 1
          fi
          if echo "${contents}" | grep -q '/docs/'; then
            echo "::error::the source distribution carries a documentation tree"
            exit 1
          fi
      - name: The wheel carries the distribution and nothing beside it
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          echo "inspecting ${wheel}"
          contents=$(python3 -c "import sys, zipfile; print(chr(10).join(zipfile.ZipFile(sys.argv[1]).namelist()))" "${wheel}")
          echo "${contents}"
          stray=$(echo "${contents}" | grep -v '^inferops/' | grep -v '^inferops-.*\.dist-info/' || true)
          if [ -n "${stray}" ]; then
            echo "::error::the wheel carries files outside the inferops package: ${stray}"
            exit 1
          fi

  api-container-image:
    name: API container image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # Built and never pushed. The ownership inventory gives this image to the
      # contributor's host: it is loaded straight into a cluster and published
      # to no registry, so a build here proves the Dockerfile still builds and
      # establishes nothing about a registry that does not exist.
      - name: Build the API image
        run: docker build -f deploy/api/Dockerfile -t inferops-api:ci .
      # 65534 is the uid the chart's pod security context sets. An image that
      # defaults to root passes every manifest check and then runs as root the
      # first time somebody starts it without Kubernetes.
      - name: The image does not default to root
        run: |
          set -euo pipefail
          user=$(docker image inspect inferops-api:ci --format '{{ .Config.User }}')
          echo "image user: ${user}"
          if [ "${user}" != "65534:65534" ]; then
            echo "::error::the API image runs as '${user}', expected 65534:65534"
            exit 1
          fi
      # The image is meant to hold the application, its carrier, and its
      # entrypoint. `.dockerignore` re-includes exactly two directories under
      # `tools/`; this refuses the third that a later broader COPY would add.
      - name: The image carries no host tooling beyond the carrier
        run: |
          set -euo pipefail
          shipped=$(docker run --rm --entrypoint python inferops-api:ci -c "import os; base='/opt/inferops/tools'; print(' '.join(sorted(d for d in os.listdir(base) if os.path.isdir(os.path.join(base, d)) and d != '__pycache__')))")
          echo "tools packages in the image: ${shipped}"
          if [ "${shipped}" != "api_carrier api_container" ]; then
            echo "::error::the API image carries host tooling: ${shipped}"
            exit 1
          fi

  dependency-and-image-scan:
    name: dependency and image vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      # Both scans go through the committed scripts rather than through a trivy
      # invocation typed into this file. The blocking severity, the artifact
      # directory, and the image reference live in scripts/security/lib.sh; a
      # copy here would be a second severity policy nobody agreed to.
      - name: Scan the committed dependency lockfile
        run: scripts/security/scan-dependencies.sh
      - name: Scan the pinned runtime image
        run: scripts/security/scan-runtime-image.sh
      - name: Publish the scan output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-scans
          path: .artifacts/security/*.json
          # 30 days, which is what the default-checks lane declares in the
          # strategy data. Nothing here may be cited as the evidence for a
          # published claim: ADR 0005 D5 requires a promoted, redacted record.
          retention-days: 30
          if-no-files-found: error

  software-bill-of-materials:
    name: software bill of materials
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Generate the CycloneDX bills of materials
        run: scripts/security/generate-sbom.sh
      - name: Publish them
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: .artifacts/security/*.cyclonedx.json
          retention-days: 30
          if-no-files-found: error

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The scan reads history, so it needs history. Every other job here
          # works from the checked-out tree and takes the default shallow clone.
          fetch-depth: 0
      # The binary is fetched from its release and checked against a digest
      # committed here, rather than against the checksum file published beside
      # it - a checksum served from the same place as the artifact proves the
      # download was not corrupted and nothing else. The action form is avoided
      # deliberately: it carries an organisation licence check this project has
      # no need to satisfy.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${archive}" gitleaks
          gitleaks version
      # The allowlist in .gitleaks.toml exempts two directories and eleven
      # published placeholder patterns, each explained in
      # .github/secret-scanning-allowlist.md. A finding outside them fails.
      # `gitleaks git .` and not `gitleaks detect`: the latter still runs at
      # 8.30.1 and is deprecated in the tool's own source, and a gate built on a
      # deprecated alias is a gate that breaks on an upgrade nobody reviewed.
      - name: No credential in the committed history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
