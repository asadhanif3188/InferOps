# THIS FIXTURE IS DELIBERATELY BROKEN. It is not deployed and not deployable.
#
# A credential-shaped environment name carrying a literal instead of a
# `secretKeyRef`. The placeholder below is not a credential of any kind and never
# was one: the rule fires on the **name carrying a value**, and never on the
# shape of the value, because a rule that matched value shapes would be a rule
# that reads secrets and its findings would be where they got published.
#
# What makes this worth refusing before an install rather than during one is
# where a rendered manifest ends up: in release history, in a diff, in a terminal
# somebody copied, and in whatever reads any of those. A value rendered once is a
# value published several times.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-default-deny
  namespace: inferops-fixture
  labels:
    app.kubernetes.io/name: fixture
    app.kubernetes.io/instance: fixture
    inferops.io/lifecycle: release
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fixture
      app.kubernetes.io/instance: fixture
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-api
  namespace: inferops-fixture
  labels:
    app.kubernetes.io/name: fixture
    app.kubernetes.io/instance: fixture
    inferops.io/lifecycle: release
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fixture
      app.kubernetes.io/instance: fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixture
        app.kubernetes.io/instance: fixture
    spec:
      serviceAccountName: fixture-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: localhost/fixture@sha256:e52c1893568a326665fb95480bdaf5279ce85a4b82faa0aa33dc6f2b4dec3744
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: INFEROPS_UPSTREAM_API_TOKEN
              value: placeholder-not-a-credential
