# THIS FIXTURE IS DELIBERATELY BROKEN. It is not deployed and not deployable.
#
# The subtle one, and the reason the ingress and egress halves of the deny are
# computed separately rather than as one boolean.
#
# This policy looks like a default-deny and reads like one in review. It declares
# only `Ingress` in `policyTypes`, so it denies everything arriving and leaves
# **egress completely unrestricted**: the pod may still reach every service in
# the cluster and everything outside it. One missing line in a list of two, and a
# check that asked "is there a deny policy?" would have answered yes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-default-deny
  namespace: inferops-fixture
  labels:
    app.kubernetes.io/name: fixture
    app.kubernetes.io/instance: fixture
    inferops.io/lifecycle: release
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fixture
      app.kubernetes.io/instance: fixture
  policyTypes:
    - Ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-api
  namespace: inferops-fixture
  labels:
    app.kubernetes.io/name: fixture
    app.kubernetes.io/instance: fixture
    inferops.io/lifecycle: release
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fixture
      app.kubernetes.io/instance: fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixture
        app.kubernetes.io/instance: fixture
    spec:
      serviceAccountName: fixture-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: localhost/fixture@sha256:e52c1893568a326665fb95480bdaf5279ce85a4b82faa0aa33dc6f2b4dec3744
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
