# The hand-written half of the reference workload's values: everything a release
# needs that no WorkloadContract, EnvironmentBinding, or platform-defaults field
# owns. It is installed after the generated file, and it sets none of the values
# the generated file holds - a test refuses it if it does.
#
# Every member is copied from charts/inferops-llm/ci/real-values.yaml, which is
# what makes the two renders comparable:
#
#   - `api.image` is the same PLACEHOLDER digest that file documents. No InferOps
#     image is published, so the digest is a contributor's build, not a contract
#     value;
#   - `model.alias` and `model.license.spdx` come from
#     docs/serving/model-source.v1.json. No contract pin determines either: the
#     alias is a display name, and the SPDX identifier is what the licence is, which
#     a repository name does not say. The download location and the licence
#     reference are not here: the renderer derives both from the repository,
#     revision, and file the contract pins, and admission refuses a hand-written
#     copy of either;
#   - the remaining members choose how the release runs on the reference host:
#     how the claim is filled and verified, and whether the release's own
#     collector runs.
#
# This is a test fixture, not a deployable values file, for the reason the API
# image digest gives.

api:
  image:
    repository: localhost/inferops-api
    digest: sha256:7961c9f9ce773095461498774bc2f25053bcba6d01c40d8448da65e217091e50
    pullPolicy: Never

runtime:
  image:
    pullPolicy: IfNotPresent

model:
  alias: qwen3-1.7b-q8_0
  license:
    spdx: Apache-2.0
  acquisition:
    enabled: true
    source: download
  cache:
    mountPath: /models
    readOnly: true
  integrity:
    verifyOnStart: sha256

telemetry:
  scrapeAnnotations: true
  collection:
    collector:
      deploy: true
