# Both jobs discovered their pods and none of the pods answered.
#
# This is the case the collection-health rules were written the way they were for. A
# target that exists and fails produces `up == 0`, which is a series; a job that
# discovered nothing produces no series at all. Counting a vector filtered by `== 1`
# would have made this scenario and the previous one identical -- both would read
# nothing -- so the rule sums `up` instead, and this fixture is what shows the
# difference: the target count keeps its full value and the sum reads zero.
#
# Synthetic. Nothing was scraped and no value here was measured.
scenarioId: every-target-down
profile: real
evaluationInstant: 600
applyCollectorRelabel: true
description: >-
  Four targets, none answering. The count stays at two per job and the up sum reads
  zero, which a count over a filtered vector could not have said.

labelSets:
  apiA: &apiA
    job: inferops-inferops-llm-platform-api
    k8s_namespace: inferops-platform
    k8s_component: platform-api
    instance: inferops-inferops-llm-api-6d4f8-2xkqp
  apiB: &apiB
    job: inferops-inferops-llm-platform-api
    k8s_namespace: inferops-platform
    k8s_component: platform-api
    instance: inferops-inferops-llm-api-6d4f8-9wbnt
  runtimeC: &runtimeC
    job: inferops-inferops-llm-serving-runtime
    k8s_namespace: inferops-platform
    k8s_component: serving-runtime
    instance: inferops-inferops-llm-runtime-0
    deployment_environment: dev
    inferops_workload_id: support-assistant
    inferops_model_id: qwen3-1-7b-q8-0
    inferops_runtime_id: llama-cpp-server
  runtimeD: &runtimeD
    job: inferops-inferops-llm-serving-runtime
    k8s_namespace: inferops-platform
    k8s_component: serving-runtime
    instance: inferops-inferops-llm-runtime-1
    deployment_environment: dev
    inferops_workload_id: support-assistant
    inferops_model_id: qwen3-1-7b-q8-0
    inferops_runtime_id: llama-cpp-server

# A target that did not answer publishes nothing, so there is no series here but
# `up` itself. That is the point: every metric query below is empty, and only the
# collection-health queries can say why.
series:
  - {name: up, labels: {<<: *apiA}, points: [[0, 0], [300, 0], [600, 0]]}
  - {name: up, labels: {<<: *apiB}, points: [[0, 0], [300, 0], [600, 0]]}
  - {name: up, labels: {<<: *runtimeC}, points: [[0, 0], [300, 0], [600, 0]]}
  - {name: up, labels: {<<: *runtimeD}, points: [[0, 0], [300, 0], [600, 0]]}
