# A mock release serving, on the mock profile. Nothing fires.
#
# Every series below was written by hand, from the shape a recorded run had. Nothing
# here was scraped and no value here was measured. The label sets are copied from the
# relabelling the mock profile's committed render performs, so an alert that
# behaves correctly against this fixture is an alert written against the labels that
# configuration would attach -- and against nothing that has ever existed.
#
# Samples sit on a 60-second grid from 0 to 2400 seconds. A release scrapes and
# evaluates rules every 30 seconds, so this grid is deliberately coarser than a
# collector's: what a result over it establishes is that a condition held at the
# instants written here, and not at every instant a collector would have asked at.
# `firstEvaluationInstant` is the first instant at which every five-minute range
# window inside an alert expression is full; before it, a rate reads a window that
# starts before the fixture does.
#
# The mock profile certifies no provider and this fixture certifies nothing about
# one. It is here so that the rule file rendered for that profile is held to a
# scenario rather than to nothing, and so that an alert which is silent there for
# the wrong reason -- a series the mock release does not carry -- is visible.
scenarioId: healthy-mock-serving
profile: mock
stepSeconds: 60
firstEvaluationInstant: 300
evaluationInstant: 2400
applyCollectorRelabel: true
description: >-
  One API replica running the mock adapter, sixty completions a minute all served,
  a readiness refusal every ten minutes, and no serving-runtime job at all. Every
  alert that applies to this profile is silent.

labelSets:
  apiA: &apiA
    job: inferops-inferops-llm-platform-api
    k8s_namespace: inferops-platform
    k8s_component: platform-api
    instance: inferops-inferops-llm-api-59c7d4f88-q4tzv
  identity: &identity
    service_version: 0.1.0
    inferops_capability_id: inferops-native-serving
    inferops_release_id: inferops
    deployment_environment: dev
    inferops_adapter_kind: mock
    inferops_model_id: mock-model
  work: &work
    inferops_workload_id: support-assistant
    inferops_model_id: mock-model

series:
  # -- the mock profile installs no serving runtime, so there is one job, one
  #    target, and no llamacpp series for a recording rule to map.
