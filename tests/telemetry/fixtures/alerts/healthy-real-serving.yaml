    inferops_runtime_image_digest: sha256:100de626bdc5b7df898c12561eefaf557019d2746d5fc8d3f4d7fd24e15ad384
  work: &work
    inferops_workload_id: support-assistant
    inferops_model_id: qwen3-1-7b-q8-0

