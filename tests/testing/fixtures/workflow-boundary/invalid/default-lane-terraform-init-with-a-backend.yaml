# inferops-lane: default-checks
#
# Refused: init without -backend=false configures a backend, which is state somebody owns.

name: checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: The step the rule refuses
        run: terraform -chdir=infra/terraform/environments/local init -input=false
