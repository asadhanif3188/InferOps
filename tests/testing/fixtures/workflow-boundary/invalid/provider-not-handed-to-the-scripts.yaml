# inferops-lane: cluster-smoke
#
# Refused: the input is declared and never becomes INFEROPS_PROVIDER, so the guard
# would refuse at run time what the workflow should refuse at review time.

name: cluster-smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: The externally owned cluster to verify and consume.
        required: true
        type: choice
        options: [kind, docker-desktop]

permissions:
  contents: read

env:
  INFEROPS_RELEASE_NAME: inferops

jobs:
  smoke:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Identify the target the provider guard resolves
        run: scripts/environment/target-detect.sh
      - name: Install, test, and uninstall the mock release
        run: scripts/environment/helm-lifecycle.sh --values charts/inferops-llm/ci/mock-values.yaml
