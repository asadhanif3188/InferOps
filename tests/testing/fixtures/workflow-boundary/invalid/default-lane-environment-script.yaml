# inferops-lane: default-checks
#
# Refused: the default lane runs no environment script. Even an offline action of one is
# a script whose other actions reach a cluster, and this check cannot read inside it.

name: checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: The step the rule refuses
        run: scripts/environment/terraform-prerequisites.sh check
