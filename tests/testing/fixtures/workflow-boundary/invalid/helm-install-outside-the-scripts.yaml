# inferops-lane: cluster-smoke
#
# Refused: a release installed directly reaches a cluster without the provider guard.

name: cluster-smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: The externally owned cluster to verify and consume.
        required: true
        type: choice
        options: [kind, docker-desktop]

permissions:
  contents: read

env:
  INFEROPS_PROVIDER: ${{ inputs.provider }}

jobs:
  smoke:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install the release
        run: helm upgrade --install inferops charts/inferops-llm --namespace inferops-platform --values charts/inferops-llm/ci/mock-values.yaml
